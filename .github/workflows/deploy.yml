name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: VisionX/frontend
        run: npm install --legacy-peer-deps

      - name: Create production env file
        working-directory: VisionX/frontend
        run: |
          echo "VITE_APP_NAME=CivicPulse AI" > .env.production
          echo "VITE_APP_VERSION=1.0.0" >> .env.production
          if [ -n "${{ secrets.VITE_API_BASE_URL }}" ]; then
            echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env.production
          else
            echo "VITE_API_BASE_URL=https://visionx-api.onrender.com/api" >> .env.production
          fi

      - name: Build frontend
        working-directory: VisionX/frontend
        env:
          NODE_ENV: production
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: VisionX/frontend/dist
          publish_branch: gh-pages
          force_orphan: true
