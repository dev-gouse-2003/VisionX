name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: VisionX/frontend/package-lock.json

      - name: Install dependencies
        working-directory: VisionX/frontend
        run: npm install

      - name: Build frontend
        working-directory: VisionX/frontend
        env:
          NODE_ENV: production
          # Replace this with your actual Render backend URL after deploying
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: CivicPulse AI
          VITE_APP_VERSION: 1.0.0
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: VisionX/frontend/dist
          publish_branch: gh-pages
